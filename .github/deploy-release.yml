name: Release

on:
  release:
    types:
      - published

defaults: *default-defaults

jobs:
  build:
    name: 'Build & Release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write  # enable GitHub OIDC token issuance for this job
    steps:
    - *checkout
    - *setup-dotnet
    - *setup-nuget
    - *setup-verlite

    - name: 'Verify Tag'
      run: |
        [[ "v$(verlite .)" == "${GITHUB_REF#refs/*/}" ]] # error out if the versions don't match

    - *restore
    - *build
    - *test
    - *pack
    - *upload-artifacts

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: 'Create Release'
      run: |
        set -x
        tag="${GITHUB_REF#refs/*/}"
        files=()

        IFS=$'\n';
        for asset in $(find ./artifacts -name "*.nupkg"); do
          files+=("$asset")
        done

        gh release upload "$tag" "${files[@]}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 'Publish Nuget'
      run: |
        dotnet nuget push 'artifacts/*.nupkg' -k ${NUGETORG_TOKEN} -s https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
        dotnet nuget push 'artifacts/*.nupkg' -k ${GITHUB_TOKEN} -s github --skip-duplicate --no-symbols
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NUGETORG_TOKEN: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
